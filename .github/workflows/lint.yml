name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dev-package dependencies
        run: |
          cd dev-package
          npm install
          cd ..
      
      - name: Verify eslint path
        run: ls -la ./dev-package/node_modules/.bin/eslint
      
      - name: Run linter
        run: ./dev-package/node_modules/.bin/eslint .
